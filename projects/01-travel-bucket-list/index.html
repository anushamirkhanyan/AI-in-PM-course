<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Travel Bucket List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.95;
      font-weight: 300;
    }

    .filters {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.75rem 1.5rem;
      border: 2px solid white;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: white;
      color: #667eea;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .card-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: cover;
      background-position: center;
      object-fit: cover;
      position: relative;
    }

    .card-image::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.2);
    }

    .card-content {
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #333;
    }

    .card-why {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .card-status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
    }

    .status-dreaming {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .status-booked {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .status-been {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: white;
    }

    .empty-state p {
      font-size: 1.2rem;
    }

    footer {
      text-align: center;
      color: white;
      margin-top: 3rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    const grid = document.getElementById('grid');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let currentFilter = 'all';

    function renderCards(filter = 'all') {
      const filtered = filter === 'all' ? travels : travels.filter(t => t.status === filter);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>No trips yet in this category!</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(travel => `
        <div class="card">
          <img src="${travel.image}" alt="${travel.place}" class="card-image" style="width: 100%; height: 200px; object-fit: cover; display: block;">
          <div class="card-content">
            <h2 class="card-title">${travel.place}</h2>
            <p style="color: #999; font-size: 0.9rem; margin-bottom: 0.8rem;">${travel.flag} ${travel.country}</p>
            <p class="card-why">"${travel.why}"</p>
            <span class="card-status status-${travel.status}">
              ${travel.status.charAt(0).toUpperCase() + travel.status.slice(1)}
            </span>
          </div>
        </div>
      `).join('');
    }

    // Event listeners for filters
    filterBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        filterBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderCards(currentFilter);
      });
    });

    // Initial render
    renderCards();
