<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Bucket List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.95;
      font-weight: 300;
    }

    .filters {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.75rem 1.5rem;
      border: 2px solid white;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: white;
      color: #667eea;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .card-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-emoji {
      position: absolute;
      font-size: 40px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 6px;
      bottom: 6px;
      right: 6px;
    }

    .card-content {
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #333;
    }

    .card-country {
      color: #999;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .card-why {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .card-status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
    }

    .status-dreaming {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .status-booked {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .status-been {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: white;
    }

    footer {
      text-align: center;
      color: white;
      margin-top: 3rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✈️ Travel Bucket List</h1>
      <p class="subtitle">Places I want to visit, places I've been, and dreams to book</p>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="dreaming">Dreaming</button>
      <button class="filter-btn" data-filter="booked">Booked</button>
      <button class="filter-btn" data-filter="been">Been</button>
    </div>

    <div class="grid" id="grid"></div>

    <footer>
      <p>Made with Claude Code for the AI in PM course</p>
    </footer>
  </div>

  <script>
    // Travel data with real images from Wikimedia Commons
    const travels = [
      // BEEN - USA
      { id: 1, place: "Boston", country: "United States", flag: "🗽 USA", why: "Historic landmarks, seafood, and autumn leaves", status: "been", emoji: "🏛️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Boston_downtown_at_dusk_MA.jpg/320px-Boston_downtown_at_dusk_MA.jpg" },
      { id: 2, place: "Miami", country: "United States", flag: "🗽 USA", why: "Art Deco architecture, beaches, and vibrant nightlife", status: "been", emoji: "🌴", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/MiamiSkylineReflectionInWater.jpg/320px-MiamiSkylineReflectionInWater.jpg" },
      { id: 3, place: "Fort Lauderdale", country: "United States", flag: "🗽 USA", why: "Beautiful beaches and waterfront charm", status: "been", emoji: "🏖️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Fort_Lauderdale_Beach_and_Intracoastal.jpg/320px-Fort_Lauderdale_Beach_and_Intracoastal.jpg" },
      { id: 4, place: "Rhode Island", country: "United States", flag: "🗽 USA", why: "Coastal beauty and charming harbor towns", status: "been", emoji: "⛵", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Newport_Cliff_Walk.jpg/320px-Newport_Cliff_Walk.jpg" },

      // BEEN - ITALY
      { id: 5, place: "Rome", country: "Italy", flag: "🇮🇹 Italy", why: "Ancient ruins, Vatican, and timeless romance", status: "been", emoji: "🏛️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Colosseum_in_Rome%2C_Italy_-_April_2007.jpg/320px-Colosseum_in_Rome%2C_Italy_-_April_2007.jpg" },
      { id: 6, place: "Florence", country: "Italy", flag: "🇮🇹 Italy", why: "Renaissance art, Duomo, and Tuscan wine", status: "been", emoji: "🎨", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Florence_Duomo_2.jpg/320px-Florence_Duomo_2.jpg" },
      { id: 7, place: "Venice", country: "Italy", flag: "🇮🇹 Italy", why: "Canals, gondolas, and magical waterways", status: "been", emoji: "🚤", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Grand_Canal%2C_Venice.jpg/320px-Grand_Canal%2C_Venice.jpg" },
      { id: 8, place: "Naples", country: "Italy", flag: "🇮🇹 Italy", why: "Mount Vesuvius, pizza, and Mediterranean vibes", status: "been", emoji: "🌋", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Vesuvius_from_Naples.jpg/320px-Vesuvius_from_Naples.jpg" },
      { id: 9, place: "Rimini", country: "Italy", flag: "🇮🇹 Italy", why: "Adriatic beaches and lively seaside culture", status: "been", emoji: "🏖️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Rimini_beach.jpg/320px-Rimini_beach.jpg" },

      // BEEN - GREECE
      { id: 10, place: "Athens", country: "Greece", flag: "🇬🇷 Greece", why: "Acropolis, ancient history, and Mediterranean sun", status: "been", emoji: "⛩️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Parthenon_from_west.jpg/320px-Parthenon_from_west.jpg" },
      { id: 11, place: "Santorini", country: "Greece", flag: "🇬🇷 Greece", why: "White-washed villages, sunsets, and Aegean views", status: "been", emoji: "🌅", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Santorini_sunset.jpg/320px-Santorini_sunset.jpg" },
      { id: 12, place: "Crete", country: "Greece", flag: "🇬🇷 Greece", why: "Minoan ruins, gorges, and island paradise", status: "been", emoji: "🏝️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Samaria_Gorge%2C_Crete.jpg/320px-Samaria_Gorge%2C_Crete.jpg" },

      // BEEN - OTHER EUROPE
      { id: 13, place: "Vienna", country: "Austria", flag: "🇦🇹 Austria", why: "Imperial palaces, classical music, and Wiener schnitzel", status: "been", emoji: "🎼", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Schonbrunn_Palace.jpg/320px-Schonbrunn_Palace.jpg" },
      { id: 14, place: "San Marino", country: "San Marino", flag: "🇸🇲 San Marino", why: "Medieval fortress in the heart of Italy", status: "been", emoji: "🏰", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/San_Marino_3_Towers.jpg/320px-San_Marino_3_Towers.jpg" },
      { id: 15, place: "Montenegro", country: "Montenegro", flag: "🇲🇪 Montenegro", why: "Dramatic coastlines and Adriatic adventure", status: "been", emoji: "⛰️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Kotor_-_Bay_of_Kotor.jpg/320px-Kotor_-_Bay_of_Kotor.jpg" },
      { id: 16, place: "Istanbul", country: "Turkey", flag: "🇹🇷 Turkey", why: "Where East meets West, bazaars and Blue Mosque", status: "been", emoji: "🕌", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Sultan_Ahmed_Mosque_%28Blue_Mosque%29.jpg/320px-Sultan_Ahmed_Mosque_%28Blue_Mosque%29.jpg" },
      { id: 17, place: "Saint Petersburg", country: "Russia", flag: "🇷🇺 Russia", why: "Winter palaces, canals, and imperial grandeur", status: "been", emoji: "❄️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Winter_Palace_in_Saint_Petersburg.jpg/320px-Winter_Palace_in_Saint_Petersburg.jpg" },

      // BEEN - MIDDLE EAST & AFRICA
      { id: 18, place: "Dubai", country: "UAE", flag: "🇦🇪 UAE", why: "Ultra-modern architecture and desert luxury", status: "been", emoji: "🌆", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Burj_Khalifa.jpg/320px-Burj_Khalifa.jpg" },
      { id: 19, place: "Sharm el-Sheikh", country: "Egypt", flag: "🇪🇬 Egypt", why: "Red Sea diving and resort paradise", status: "been", emoji: "🤿", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Coral_reef.jpg/320px-Coral_reef.jpg" },
      { id: 20, place: "Hurghada", country: "Egypt", flag: "🇪🇬 Egypt", why: "Crystal waters and coral reef adventures", status: "been", emoji: "🪸", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Hurghada_beach.jpg/320px-Hurghada_beach.jpg" },
      { id: 21, place: "Mauritius", country: "Mauritius", flag: "🇲🇺 Mauritius", why: "Tropical island paradise with turquoise lagoons", status: "been", emoji: "🏝️", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Mauritius_lagoon.jpg/320px-Mauritius_lagoon.jpg" },

      // DREAMING
      { id: 22, place: "Buenos Aires", country: "Argentina", flag: "🇦🇷 Argentina", why: "Usuaia at the end of the world, asado, empanadas and alfajores", status: "dreaming", emoji: "🌍", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Teatro_Colon_Buenos_Aires.jpg/320px-Teatro_Colon_Buenos_Aires.jpg" }
    ];

    const grid = document.getElementById('grid');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let currentFilter = 'all';

    function renderCards(filter = 'all') {
      const filtered = filter === 'all' ? travels : travels.filter(t => t.status === filter);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>No trips yet in this category!</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(travel => `
        <div class="card">
          <div class="card-image">
            <img src="${travel.image}" alt="${travel.place}" onerror="this.style.display='none'">
            <div class="card-emoji">${travel.emoji}</div>
          </div>
          <div class="card-content">
            <h2 class="card-title">${travel.place}</h2>
            <p class="card-country">${travel.flag}</p>
            <p class="card-why">"${travel.why}"</p>
            <span class="card-status status-${travel.status}">
              ${travel.status.charAt(0).toUpperCase() + travel.status.slice(1)}
            </span>
          </div>
        </div>
      `).join('');
    }

    // Event listeners for filters
    filterBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        filterBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderCards(currentFilter);
      });
    });

    // Initial render
    renderCards();
  </script>
</body>
</html>
