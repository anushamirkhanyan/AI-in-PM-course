<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Bucket List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.95;
      font-weight: 300;
    }

    .filters {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.75rem 1.5rem;
      border: 2px solid white;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: white;
      color: #667eea;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .card-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-emoji {
      position: absolute;
      font-size: 40px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 6px;
      bottom: 6px;
      right: 6px;
    }

    .card-content {
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #333;
    }

    .card-country {
      color: #999;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .card-why {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .card-status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
    }

    .status-dreaming {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .status-booked {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .status-been {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: white;
    }

    footer {
      text-align: center;
      color: white;
      margin-top: 3rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Travel Bucket List</h1>
      <p class="subtitle">Places I want to visit, places I've been, and dreams to book</p>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="dreaming">Dreaming</button>
      <button class="filter-btn" data-filter="booked">Booked</button>
      <button class="filter-btn" data-filter="been">Been</button>
    </div>

    <div class="grid" id="grid"></div>

    <footer>
      <p>Made with Claude Code for the AI in PM course</p>
    </footer>
  </div>

  <script>
    // Travel data with real city photos
    const travels = [
      // BEEN - USA
      { id: 1, place: "New York", country: "United States", flag: "USA", why: "Times Square, iconic skyline, endless energy", status: "been", emoji: "🗽", image: "https://source.unsplash.com/400x300/?newyork,city" },
      { id: 2, place: "Boston", country: "United States", flag: "USA", why: "Historic landmarks, seafood, autumn leaves", status: "been", emoji: "🏛", image: "https://source.unsplash.com/400x300/?boston,city" },
      { id: 3, place: "Miami", country: "United States", flag: "USA", why: "Art Deco, beaches, vibrant nightlife", status: "been", emoji: "🌴", image: "https://source.unsplash.com/400x300/?miami,beach" },
      { id: 4, place: "Fort Lauderdale", country: "United States", flag: "USA", why: "Beautiful beaches and waterfront charm", status: "been", emoji: "🏖", image: "https://source.unsplash.com/400x300/?fortlauderdale,beach" },
      { id: 5, place: "Rhode Island", country: "United States", flag: "USA", why: "Newport Mansions, coastal beauty, harbor towns", status: "been", emoji: "⛵", image: "https://source.unsplash.com/400x300/?newport,coast" },

      // BEEN - ITALY
      { id: 6, place: "Rome", country: "Italy", flag: "Italy", why: "Colosseum, Vatican, timeless romance", status: "been", emoji: "🏛", image: "https://source.unsplash.com/400x300/?rome,italy" },
      { id: 7, place: "Florence", country: "Italy", flag: "Italy", why: "Renaissance art, Duomo, Tuscan wine", status: "been", emoji: "🎨", image: "https://source.unsplash.com/400x300/?florence,italy" },
      { id: 8, place: "Venice", country: "Italy", flag: "Italy", why: "Grand Canal, gondolas, magical waterways", status: "been", emoji: "🚤", image: "https://source.unsplash.com/400x300/?venice,italy" },
      { id: 9, place: "Naples", country: "Italy", flag: "Italy", why: "Vesuvius, pizza, Mediterranean vibes", status: "been", emoji: "🌋", image: "https://source.unsplash.com/400x300/?naples,italy" },
      { id: 10, place: "Rimini", country: "Italy", flag: "Italy", why: "Adriatic beaches, lively seaside culture", status: "been", emoji: "🏖", image: "https://source.unsplash.com/400x300/?rimini,beach" },

      // BEEN - GREECE
      { id: 11, place: "Athens", country: "Greece", flag: "Greece", why: "Parthenon, ancient history, Mediterranean", status: "been", emoji: "⛩", image: "https://source.unsplash.com/400x300/?athens,greece" },
      { id: 12, place: "Santorini", country: "Greece", flag: "Greece", why: "White villages, sunsets, Aegean views", status: "been", emoji: "🌅", image: "https://source.unsplash.com/400x300/?santorini,greece" },
      { id: 13, place: "Crete", country: "Greece", flag: "Greece", why: "Minoan ruins, Samaria Gorge, island paradise", status: "been", emoji: "🏝", image: "https://source.unsplash.com/400x300/?crete,greece" },

      // BEEN - OTHER EUROPE
      { id: 14, place: "Vienna", country: "Austria", flag: "Austria", why: "Schonbrunn Palace, classical music, schnitzel", status: "been", emoji: "🎼", image: "https://source.unsplash.com/400x300/?vienna,austria" },
      { id: 15, place: "San Marino", country: "San Marino", flag: "San Marino", why: "Medieval fortress surrounded by Italy", status: "been", emoji: "🏰", image: "https://source.unsplash.com/400x300/?sanmarino" },
      { id: 16, place: "Montenegro", country: "Montenegro", flag: "Montenegro", why: "Bay of Kotor, dramatic coastlines, adventure", status: "been", emoji: "⛰", image: "https://source.unsplash.com/400x300/?montenegro,coast" },
      { id: 17, place: "Istanbul", country: "Turkey", flag: "Turkey", why: "Blue Mosque, East meets West, bazaars", status: "been", emoji: "🕌", image: "https://source.unsplash.com/400x300/?istanbul,turkey" },
      { id: 18, place: "Saint Petersburg", country: "Russia", flag: "Russia", why: "Winter Palace, canals, imperial grandeur", status: "been", emoji: "❄", image: "https://source.unsplash.com/400x300/?stpetersburg,russia" },

      // BEEN - MIDDLE EAST & AFRICA
      { id: 19, place: "Dubai", country: "UAE", flag: "UAE", why: "Burj Khalifa, ultra-modern, desert luxury", status: "been", emoji: "🌆", image: "https://source.unsplash.com/400x300/?dubai,uae" },
      { id: 20, place: "Sharm el-Sheikh", country: "Egypt", flag: "Egypt", why: "Red Sea diving, coral reefs, paradise", status: "been", emoji: "🤿", image: "https://source.unsplash.com/400x300/?sharmelsheikh,beach" },
      { id: 21, place: "Hurghada", country: "Egypt", flag: "Egypt", why: "Crystal waters, coral reef adventures", status: "been", emoji: "🪸", image: "https://source.unsplash.com/400x300/?hurghada,egypt" },
      { id: 22, place: "Mauritius", country: "Mauritius", flag: "Mauritius", why: "Tropical island, turquoise lagoons", status: "been", emoji: "🏝", image: "https://source.unsplash.com/400x300/?mauritius,beach" },

      // DREAMING
      { id: 23, place: "Buenos Aires", country: "Argentina", flag: "Argentina", why: "Tango, asado, empanadas, alfajores, Obelisk", status: "dreaming", emoji: "🌍", image: "https://source.unsplash.com/400x300/?buenosaires,argentina" }
    ];

    const grid = document.getElementById('grid');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let currentFilter = 'all';

    function renderCards(filter = 'all') {
      const filtered = filter === 'all' ? travels : travels.filter(t => t.status === filter);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>No trips yet in this category!</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(travel => `
        <div class="card">
          <div class="card-image">
            <img src="${travel.image}" alt="${travel.place}" onerror="this.style.display='none'">
            <div class="card-emoji">${travel.emoji}</div>
          </div>
          <div class="card-content">
            <h2 class="card-title">${travel.place}</h2>
            <p class="card-country">${travel.flag}</p>
            <p class="card-why">"${travel.why}"</p>
            <span class="card-status status-${travel.status}">
              ${travel.status.charAt(0).toUpperCase() + travel.status.slice(1)}
            </span>
          </div>
        </div>
      `).join('');
    }

    // Event listeners for filters
    filterBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        filterBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderCards(currentFilter);
      });
    });

    // Initial render
    renderCards();
  </script>
</body>
</html>
